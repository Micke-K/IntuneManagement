title: ""
body:
  - type: markdown
    attributes:
      value: |
        Ideas is for shaping something before it becomes a request. Say what you
        are trying to achieve rather than the control you picture, and it will be
        clear whether the application should grow a feature or already has one.

  - type: dropdown
    id: version
    attributes:
      label: Which version are you using?
      options:
        - 4.0 beta
        - 3.x
        - Neither yet, just looking
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: What are you trying to achieve?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: How do you picture it working?

  - type: textarea
    id: scale
    attributes:
      label: How often, and at what scale?
      description: >
        How many tenants, how many policies, how often you do it. Scale changes
        the answer more than anything else here.
