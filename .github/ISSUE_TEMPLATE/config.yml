# Turns off the "open a blank issue" escape hatch, so every report arrives
# through a form with the fields that make it answerable. Questions go to
# Discussions, which is where most of them already end up.
blank_issues_enabled: false
contact_links:
  - name: Question, or not sure it is a bug
    url: https://github.com/Micke-K/IntuneManagement/discussions/categories/q-a
    about: Ask in Q&A. Most "it does not show my policies" reports are answered there in a day.
  - name: Feature idea worth discussing first
    url: https://github.com/Micke-K/IntuneManagement/discussions/categories/ideas
    about: Ideas that are still taking shape belong here. A concrete request can go straight to an issue.
  - name: Version 4.0 beta feedback
    url: https://github.com/Micke-K/IntuneManagement/discussions/categories/announcements
    about: Testing the 4.0 beta? Start at the pinned announcement, which lists what to try first.
  - name: Security vulnerability
    url: https://github.com/Micke-K/IntuneManagement/security/advisories/new
    about: Never report a security problem in a public issue. Use private reporting.
